name: Resolve rounds & publish
on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC: SNOTEL end-of-day data for D+2 is in for matured rounds
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# its own group: in the shared benchmark-data group a busier workflow queued
# behind it replaced this pending run, cancelling the day's scoring (10-23,
# 10-24). Pushes rebase onto main, so running alongside data writers is safe.
concurrency:
  group: resolve
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: deadline check reads first-commit times
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          # immutable (3+ days old) API responses: history rebuilds stay warm
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Resolve matured rounds
        run: |
          powderbench resolve
          powderbench resolve-events || true
      - name: Rebuild leaderboard and site data
        run: |
          powderbench build-leaderboard
          powderbench build-site
          # season-explorer series: resorts reads the local archive; era5/stations
          # top-ups ride the API caches (one small window fetch per league)
          for L in $(powderbench leagues); do
            powderbench build-history --league "$L" || true
          done
      - name: Commit results
        run: |
          git config user.name "powderbench-bot"
          git config user.email "bot@users.noreply.github.com"
          # only paths that exist: a missing one (data/events before the first
          # storm) makes `git add` fail the whole commit (it did, 10-20..10-25)
          for p in data/rounds data/results data/events site/data site/api site/docs site/badges; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --cached --quiet || git commit -m "Resolve rounds & update leaderboard"
          # main moves all day (submission merges) and GitHub's git backend
          # sometimes answers a push with a 500 (11-12: the day's scoring was
          # computed, then lost at this step), so rebase and retry
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
