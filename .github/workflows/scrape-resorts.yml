name: Scrape resort snow reports
run-name: "Scrape resort snow reports [${{ inputs.hemisphere }}]"
# Every site is fetched at most twice a day: south at 13:00 + 20:30 UTC, north
# at 16:30 + 20:30. The keeper (keeper.yml) starts each slot exactly once;
# there is no cron here, because GitHub's scheduler dropped slots (one scrape
# on 11-09 instead of three) and a late cron run next to a keeper run would
# fetch a site a third time.
on:
  workflow_dispatch:
    inputs:
      hemisphere:
        description: "S (13:00 UTC slot), N (16:30 UTC slot) or all (20:30 UTC slot)"
        type: choice
        options: [all, S, N]
        default: all

permissions:
  contents: write

concurrency:
  group: scrape-resorts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scrape
        run: |
          case "${{ inputs.hemisphere }}" in
            S) powderbench scrape-resorts --hemisphere S ;;
            N) powderbench scrape-resorts --hemisphere N ;;
            *) powderbench scrape-resorts ;;
          esac
      - name: Commit snapshots
        run: |
          git config user.name "powderbench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/resortreports
          git diff --cached --quiet || git commit -m "Archive resort snow reports"
          # main moves all day and GitHub sometimes answers a push with a 500
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 20))
          done
          exit 1
