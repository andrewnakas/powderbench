name: Baseline submissions
on:
  schedule:
    # GitHub cron starts up to ~5 h late, and baselines must not see post-cutoff
    # data: fire every 2 h; a run submits only for leagues whose next cutoff is
    # 2.5-9 h away and that have no baselines yet (powderbench leagues --due
    # baselines), so each cutoff gets 3-4 chances and none is ever too close
    - cron: "15 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "League name (see data/leagues.yaml)"
        required: true
        default: "stations"
      round_date:
        description: "Round date (YYYY-MM-DD); default: next cutoff"
        required: false

permissions:
  contents: write

concurrency: benchmark-data

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[grib,agents]
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Generate baseline forecasts
        run: |
          LEAGUES="${{ github.event.inputs.league }}"
          if [ -z "$LEAGUES" ]; then
            LEAGUES=$(powderbench leagues --due baselines)
          fi
          echo "due: ${LEAGUES:-none}"
          ROUND="${{ github.event.inputs.round_date }}"
          FAILED=0
          for LEAGUE in $LEAGUES; do
            # one league's outage must not block the others; the default round
            # is the one whose cutoff comes next
            powderbench baseline-submit $ROUND --league "$LEAGUE" || FAILED=1
            # house agents read today's model forecasts, so they run right after
            powderbench house-submit $ROUND --league "$LEAGUE" || true
          done
          exit $FAILED
      - name: Commit
        run: |
          git config user.name "powderbench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/submissions
          git diff --cached --quiet || git commit -m "Baseline submissions"
          git pull --rebase origin main
          git push
