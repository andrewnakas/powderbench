name: Baseline submissions
on:
  schedule:
    - cron: "15 23 * * *" # stations: 45 min before tomorrow's 00:00 UTC cutoff
    - cron: "15 10 * * *" # era5 + resorts: 45 min before today's 11:00 UTC cutoff (round D = tomorrow)
  workflow_dispatch:
    inputs:
      league:
        description: "League name (see data/leagues.yaml)"
        required: true
        default: "stations"
      round_date:
        description: "Round date (YYYY-MM-DD); default: next cutoff"
        required: false

permissions:
  contents: write

concurrency: benchmark-data

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[grib]
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Generate baseline forecasts
        run: |
          LEAGUES="${{ github.event.inputs.league }}"
          SLOT_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
          if [ -z "$LEAGUES" ]; then
            # each cron slot covers the leagues whose cutoff is the next hour
            # the *scheduled* slot, not the clock: runs often start 30-60 min late
            LEAGUES=$(powderbench leagues --due baselines --hour "$SLOT_HOUR")
          fi
          ROUND="${{ github.event.inputs.round_date }}"
          FAILED=0
          for LEAGUE in $LEAGUES; do
            # one league's outage must not block the others; the default round
            # is the one whose cutoff comes next
            powderbench baseline-submit $ROUND --league "$LEAGUE" ${SLOT_HOUR:+--slot-hour "$SLOT_HOUR"} || FAILED=1
          done
          exit $FAILED
      - name: Commit
        run: |
          git config user.name "powderbench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/submissions
          git diff --cached --quiet || git commit -m "Baseline submissions"
          git pull --rebase origin main
          git push
