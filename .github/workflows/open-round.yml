name: Open round
on:
  schedule:
    - cron: "5 0 * * *" # stations: open tomorrow's round (~24h window to 00:00 UTC cutoff)
    - cron: "5 11 * * *" # era5 + resorts: open D+2 (~24h window to the 11:00 UTC D+1 cutoff)
    - cron: "5 21 * * *" # alps: open D+2 (~24h window to the 21:00 UTC D+1 cutoff)
  workflow_dispatch:
    inputs:
      league:
        description: "League name(s) (see data/leagues.yaml), or missing: every round under 24 h from its cutoff that was never opened"
        required: true
        default: "stations"
      round_date:
        description: "Round date (YYYY-MM-DD); default per league"
        required: false

permissions:
  contents: write

concurrency:
  group: open-round
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Open round
        run: |
          LEAGUES="${{ github.event.inputs.league }}"
          if [ "$LEAGUES" = "missing" ]; then
            # the keeper's hourly catch-up; never re-opens an existing round
            powderbench open-missing
            exit $?
          fi
          if [ -z "$LEAGUES" ]; then
            # each cron slot opens the leagues whose cutoff hour it is (leagues.yaml)
            # the *scheduled* slot, not the clock: runs often start 30-60 min late
            SLOT_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            LEAGUES=$(powderbench leagues --due open --hour "$SLOT_HOUR")
          fi
          FAILED=0
          for LEAGUE in $LEAGUES; do
            # one league's outage must not block the others
            if [ -n "${{ github.event.inputs.round_date }}" ]; then
              powderbench open-round --league "$LEAGUE" --round-date "${{ github.event.inputs.round_date }}" || FAILED=1
            else
              powderbench open-round --league "$LEAGUE" || FAILED=1
            fi
          done
          if [ -z "${{ github.event.inputs.league }}" ]; then
            # an earlier slot that GitHub dropped or cancelled left its round unopened
            # (alps 2026-11-25): open it now if its cutoff is still ahead
            powderbench open-missing || FAILED=1
          fi
          exit $FAILED
      - name: Commit
        run: |
          git config user.name "powderbench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rounds data/submissions
          git diff --cached --quiet || git commit -m "Open round"
          # main moves all day and GitHub sometimes answers a push with a 500
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 20))
          done
          exit 1
